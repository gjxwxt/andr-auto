name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install typescript
        run: pnpm install -D typescript

      - name: Build web app
        run: pnpm build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.0
          ndk-version: 25.1.8937393

      - name: Setup pnpm and Install Capacitor CLI
        shell: bash
        run: |
          # 1. 运行 pnpm setup（确保目录被创建）
          pnpm setup

          # 2. 强制设置正确的 PNPM_HOME 路径
          # 我们根据 pnpm 的标准输出（日志中已打印）来确定这个路径。
          # 并将其添加到 GITHUB_PATH 和 GITHUB_ENV，使其在后续步骤中生效。
          # 注意：这里的路径是 "/home/runner/.local/share/pnpm"，必须精确匹配 runner 的环境。
          PNPM_HOME_PATH="/home/runner/.local/share/pnpm"

          # 将路径添加到 GITHUB_PATH，供后续 steps 使用
          echo "$PNPM_HOME_PATH" >> $GITHUB_PATH

          # 设置 PNPM_HOME 环境变量
          echo "PNPM_HOME=$PNPM_HOME_PATH" >> $GITHUB_ENV

          # 打印确认信息 (可选)
          echo "PNPM_HOME 已设置: $PNPM_HOME_PATH"
          echo "已将该路径添加到 PATH 中"

          # 3. 安装 @capacitor/cli
          # 此时，PATH 应该已更新，全局安装的包可以正常安装和使用。
          pnpm install -g @capacitor/cli

          # 4. 执行同步
          npx cap sync

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
