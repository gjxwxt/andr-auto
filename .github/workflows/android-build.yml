name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.0
          ndk-version: 25.1.8937393

      - name: Setup Capacitor
        run: |
          # 1. 设置 PNPM_HOME 环境变量
          # (pnpm store path) 找到缓存路径，然后推断出全局 bin 目录
          # 并将其添加到 GitHub Actions 的环境变量中，供后续步骤使用。
          echo "PNPM_HOME=$(pnpm store path)/../global" >> $GITHUB_ENV

          # 2. 将 PNPM_HOME 路径添加到系统的 PATH 环境变量中
          # 这样 npx cap sync 就能找到全局安装的 @capacitor/cli
          echo "$(pnpm store path)/../global" >> $GITHUB_PATH
          pnpm install -D typescript
          pnpm install -g @capacitor/cli
          npx cap sync

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
